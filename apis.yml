aid: elementl
name: Elementl
description: >-
  Elementl, Inc. is the company behind Dagster, rebranded as Dagster Labs in August 2023.
  Founded in 2018 by Nick Schrock (creator of GraphQL) and led by CEO Pete Hunt, the
  San Francisco company builds Dagster, an open-source, Apache-2.0 licensed, cloud-native
  data orchestration platform, and Dagster+, its managed cloud offering. Dagster's
  defining innovation is the Software-Defined Asset model, which treats data tables, ML
  models, and datasets as first-class, versioned objects with built-in lineage, data
  quality checks, and observability rather than as ordered task lists. The platform
  exposes a GraphQL API and a REST API for reporting external asset materializations,
  checks, and observations, plus Python and CLI clients. The company has raised roughly
  $48.8M, including a $33M Series B (2023) led by Georgian with participation from
  Sequoia, Index Ventures, Amplify, 8VC, Human Capital, Hanover, and Slow. The Dagster
  product API surface is catalogued separately in the api-evangelist/dagster profile.
